name: build-vst3

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        shell: pwsh
        run: |
          cmake --version
          Write-Host "--- available Visual Studio generators ---"
          (cmake --help | Select-String -Pattern "Visual Studio \d+") | ForEach-Object { $_.Line.Trim() }

      - name: Configure
        shell: pwsh
        run: |
          # Don't pin a VS generator name: windows-latest may ship a different
          # Visual Studio version than we expect. Let CMake pick the default
          # (newest VS) and force a 64-bit build for FL Studio.
          cmake -B build -A x64
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Configure with -A x64 failed; retrying with default architecture..."
            Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
            cmake -B build
          }

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # Tee so the log is visible in the UI *and* captured for annotations.
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          $exit = $LASTEXITCODE
          Write-Host "cmake exit code: $exit"
          if ($exit -ne 0) { exit $exit }

      # Publish compile errors as annotations. Annotations ARE readable via the
      # public check-runs API, so failures can be debugged without copy/pasting
      # logs out of the Actions UI.
      - name: Report build errors
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $lines = @(Get-Content build.log -ErrorAction SilentlyContinue)
          if ($lines.Count -eq 0) {
            Write-Host "::error::build.log not found - cannot extract compiler errors."
            exit 0
          }

          $errs = @($lines | Where-Object { $_ -match 'error [A-Z]+\d+|fatal error|CMake Error' })
          if ($errs.Count -eq 0) { $errs = @($lines | Select-Object -Last 30) }

          $report = @($errs | Select-Object -First 40 | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $escaped = @($report | ForEach-Object { $_ -replace '%', '%25' -replace "`r", '' })
          Write-Host ("::error::Build failed - first errors:%0A" + ($escaped -join '%0A'))

          $tail = @($lines | Select-Object -Last 25 | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $tailEsc = @($tail | ForEach-Object { $_ -replace '%', '%25' -replace "`r", '' })
          Write-Host ("::notice title=Tail of build log::" + ($tailEsc -join '%0A'))
          exit 0

      - name: Locate artifact
        id: locate
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "MidiForge.vst3" | Select-Object -First 1
          if (-not $vst3) { throw "MidiForge.vst3 not found" }
          echo "path=$($vst3.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: MidiForge-vst3
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path CMakeLists.txt -Pattern 'VERSION\s+(\d+\.\d+\.\d+)' | Select-Object -First 1
          if (-not $m) { throw "Version not found in CMakeLists.txt" }
          $v = $m.Matches[0].Groups[1].Value
          Write-Host "MidiForge version: $v"
          echo "value=$v" >> $env:GITHUB_OUTPUT

      - name: Package release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ steps.locate.outputs.path }}" `
                           -DestinationPath "MidiForge-${{ steps.version.outputs.value }}-vst3.zip" -Force

      # Publishing a release makes the build downloadable WITHOUT a GitHub login,
      # which is much friendlier than the Actions artifact page. The tag is
      # derived from CMakeLists so a version bump = a new release automatically.
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ steps.version.outputs.value }}
          name: MidiForge v${{ steps.version.outputs.value }}
          body: |
            Build automatico de MidiForge v${{ steps.version.outputs.value }} (VST3, Windows x64).

            **Instalar / actualizar:** cierra FL Studio, descomprime el ZIP y copia
            `MidiForge.vst3` a `C:\Program Files\Common Files\VST3\` (sustituye la
            version anterior). Despues abre FL y, si hace falta, Options ->
            Manage plugins -> Find more plugins.

            Cambios de esta version: ver CHANGELOG.md en el repositorio.
          files: MidiForge-${{ steps.version.outputs.value }}-vst3.zip
          make_latest: true
